<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #007bff;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #333;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        nav a:hover {
            color: #00bfff;
        }

        .container {
            text-align: center;
            padding: 80px 20px;
        }

        .container h1 {
            font-size: 40px;
        }

        .container p {
            font-size: 18px;
            color: #555;
        }

        .button {
            display: inline-block;
            padding: 12px 25px;
            margin: 10px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .login {
            background-color: #007bff;
        }

        .register {
            background-color: #28a745;
        }

        .button:hover {
            opacity: 0.8;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Welcome to My Website</h1>
        <p>Your simple HTML website</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>

    <!-- Main Content -->
    <div class="container">

        <h1>Welcome!</h1>

        <p>
            Welcome to our website. Please login if you already
            have an account or register to create a new account.
        </p>

        <a href="login.html" class="button login">Login</a>

        <a href="register.html" class="button register">Register</a>

    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

</body>
</html>
